[package]
name = "chrono-inputs-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
sha2 = "0.11"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
chrono-inputs = { path = "../inputs", features = ["test-support"] }

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"

[[test]]
name = "selection"
path = "tests/selection.rs"

[[test]]
name = "offline_pair"
path = "tests/offline_pair.rs"
