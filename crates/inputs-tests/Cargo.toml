[package]
name = "chrono-inputs-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
chrono-inputs = { path = "../inputs" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"

[[test]]
name = "selection"
path = "tests/selection.rs"
