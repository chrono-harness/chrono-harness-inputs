[package]
name = "chrono-inputs"
version = "0.1.1"
edition = "2024"
publish = false
description = "Explicit retained input snapshot transport"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-inputs"
path = "src/main.rs"
test = false
bench = false

[features]
test-support = []

[dependencies]
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.47", features = ["formatting"] }
tempfile = "3"
sha2 = "0.10"
serde_jcs = "=0.2.0"
verus_builtin_macros = "=0.0.0-2026-04-20-1748"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
