[package]
name = "chrono-inputs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit retained input snapshot transport"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-inputs"
path = "src/main.rs"
test = false
bench = false

[features]
test-support = []

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
serde_json = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
