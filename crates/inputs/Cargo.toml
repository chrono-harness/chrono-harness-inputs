[package]
name = "chrono-inputs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit retained input snapshot transport"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-inputs"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-judge-registration = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
chrono-judge-filemap = { git = "https://github.com/chrono-harness/chrono-harness-judge-filemap.git", rev = "545c03a0df4259921d927e3e9fffd9fa2b65c68d" }
serde_json = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
